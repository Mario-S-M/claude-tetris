<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" aria-label="Cambiar a tema claro" />
            <span class="theme-switch-track">
              <span class="theme-switch-thumb"></span>
            </span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <div class="highscores">
          <p class="highscores-title">TOP 5</p>
          <ol id="start-highscores-list" class="highscores-list"></ol>
          <div class="stats-row">
            <span>Mejor combo: <strong id="start-best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="start-max-lines">0</strong></span>
          </div>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="secondary-btn">Resetear récords</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="overlay-highscore-form" class="overlay-highscore-form hidden">
          <label for="player-name-input">¡Nuevo récord! Ingresa tu nombre:</label>
          <input type="text" id="player-name-input" maxlength="12" placeholder="JUGADOR" autocomplete="off" />
          <button id="save-name-btn">Guardar</button>
        </div>

        <div id="overlay-highscores" class="highscores hidden">
          <p class="highscores-title">TOP 5</p>
          <ol id="overlay-highscores-list" class="highscores-list"></ol>
          <div class="stats-row">
            <span>Mejor combo: <strong id="overlay-best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="overlay-max-lines">0</strong></span>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
